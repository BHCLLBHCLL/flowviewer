[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowviewer"
description = "Post-processing viewer for Cradle CFD fph/fld/cgns files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
dependencies = [
    "numpy>=1.24",
    "vtk>=9.3",
    "PyQt5>=5.15",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
flowviewer = "fv.gui.main:run_gui"

[tool.setuptools.packages.find]
include = ["fv*"]
exclude = ["tests*", "analysis*", "scripts*"]

[tool.setuptools.package-data]
fv = ["*.tlb"]
