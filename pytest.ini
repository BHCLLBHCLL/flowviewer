[pytest]
# NOTE: do not use --basetemp here: pytest creates basetemp with mode=0o700
# which becomes inaccessible under the DSH sandbox on Windows. The
# tests/conftest.py overrides tmp_path/tmp_path_factory with default
# permissions rooted at tests/pytest_tmp instead.

markers =
    slow: long-running big-file regressions (opt-in via -m slow)
addopts = -m "not slow"
